name: Daily, Push, and Manual Triggered Update
on:
  schedule:
    - cron: '0 12 * * *'  # Runs every day at 12:00 PM (UTC)
  push:
    branches:
      - main  # Triggers the workflow on every push to the 'main' branch
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  update_job:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for all branches and tags

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Find a working proxy (the site tarpits GitHub/Azure IPs)
      run: |
        TARGET="https://www.sondaggipoliticoelettorali.it/Home.aspx?st=HOME"
        { curl -s --max-time 20 "https://api.proxyscrape.com/v3/free-proxy-list/get?request=displayproxies&protocol=http&timeout=8000&proxy_format=ipport&format=text";
          curl -s --max-time 20 "https://proxylist.geonode.com/api/proxy-list?limit=100&page=1&sort_by=lastChecked&sort_type=desc&protocols=http%2Chttps" | jq -r '.[]? | "\(.ip):\(.port)"'; } \
          | tr -d '\r' | grep -E '^[0-9.]+:[0-9]+$' | sort -u > proxies.txt || true
        echo "Testing $(wc -l < proxies.txt) proxies"
        test_one() { code=$(curl -s --max-time 8 --proxy "http://$1" "$TARGET" -o /dev/null -w "%{http_code}" 2>/dev/null); [ "$code" = "200" ] && echo "$1"; return 0; }
        export -f test_one
        export TARGET
        PROXY=$(head -400 proxies.txt | xargs -P 25 -n 1 -I{} bash -c 'test_one "$@"' _ {} | head -1)
        if [ -z "$PROXY" ]; then echo "No working proxy found"; exit 1; fi
        echo "Using proxy $PROXY"
        echo "SCRAPER_PROXY=$PROXY" >> "$GITHUB_ENV"

    - name: Set up Geckodriver
      uses: browser-actions/setup-geckodriver@latest
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        geckodriver-version: 'latest'

    - name: Run daily update script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python llm_poll_parser/daily_update.py

    - name: Commit changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add .
        if git diff-index --quiet HEAD; then
          echo "No changes to commit"
        else
          git commit -m "Daily update: $(date +'%Y-%m-%d')"
        fi
      shell: bash

    - name: Rebase and force push changes
      if: github.ref == 'refs/heads/main'  # only scheduled/push runs on main may push to main
      run: |
        git fetch origin main
        git rebase origin/main
        git push origin main --force
      shell: bash