name: Throwaway connectivity test (delete before merge)
on:
  push:
    branches:
      - fix/gha-site-timeout

jobs:
  proxy_test:
    runs-on: ubuntu-latest
    steps:
    - name: Probe public proxies against target site
      run: |
        sudo apt-get install -y jq >/dev/null 2>&1 || true
        curl -s --max-time 20 "https://proxylist.geonode.com/api/proxy-list?limit=50&page=1&sort_by=lastChecked&sort_type=desc&protocols=http%2Chttps" -o proxies.json
        echo "got $(jq length proxies.json) proxies"
        TARGET="https://www.sondaggipoliticoelettorali.it/Home.aspx?st=HOME"
        count=0
        for p in $(jq -r '.[] | "\(.ip):\(.port)"' proxies.json); do
          code=$(curl -s --max-time 12 --proxy "http://$p" "$TARGET" -o /dev/null -w "%{http_code}" || echo FAIL)
          echo "$p -> $code"
          if [ "$code" = "200" ]; then count=$((count+1)); fi
          if [ "$count" -ge 3 ]; then echo "found 3 working, stopping"; break; fi
        done
        echo "TOTAL_WORKING=$count"
