name: Throwaway connectivity test (delete before merge)
on:
  push:
    branches:
      - fix/gha-site-timeout

jobs:
  net_test_macos:
    runs-on: macos-latest
    steps:
    - name: Curl target site from macOS runner
      run: |
        curl -s --max-time 30 "https://www.sondaggipoliticoelettorali.it/Home.aspx?st=HOME" -o /dev/null -w "macos: %{http_code} in %{time_total}s\n" || echo "macos: FAILED"
        curl -s --max-time 10 ifconfig.me || true; echo

  net_test_ubuntu:
    runs-on: ubuntu-latest
    steps:
    - name: Curl target site from Ubuntu runner (control)
      run: |
        curl -s --max-time 30 "https://www.sondaggipoliticoelettorali.it/Home.aspx?st=HOME" -o /dev/null -w "ubuntu: %{http_code} in %{time_total}s\n" || echo "ubuntu: FAILED"
        curl -s --max-time 10 ifconfig.me || true; echo
