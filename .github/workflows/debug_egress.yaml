# TEMPORARY DEBUG WORKFLOW — round 2. workflow_dispatch + push to this branch only.
# NEVER merge to main; no schedule. DELETE once egress question is settled.
name: DEBUG egress probes r2 (manual only)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/gha-hosted-egress

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe egress methods round 2
        run: |
          set +e
          SITE="https://www.sondaggipoliticoelettorali.it"
          HOME_URL="$SITE/Home.aspx?st=HOME"
          LISTA_URL="$SITE/ListaSondaggi.aspx?st=SONDAGGI"
          T=20

          rows() { grep -c "dgSondaggi_Row" "$1" 2>/dev/null; }

          echo "===== e) GOOGLE TRANSLATE PROXY (translate.goog) ====="
          curl -s -m 40 -o /tmp/e_home.html -w "translate home: http=%{http_code}\n" \
            "https://www-sondaggipoliticoelettorali-it.translate.goog/Home.aspx?st=HOME&_x_tr_sl=it&_x_tr_tl=en&_x_tr_hl=en"
          curl -s -m 40 -o /tmp/e_lista.html -w "translate lista: http=%{http_code} size=%{size_download}\n" \
            "https://www-sondaggipoliticoelettorali-it.translate.goog/ListaSondaggi.aspx?st=SONDAGGI&_x_tr_sl=it&_x_tr_tl=en&_x_tr_hl=en"
          echo "RESULT e-translate: lista rows=$(rows /tmp/e_lista.html)"

          echo "===== d2) FREE PROXY POOL, up to 30 candidates, stop at 2 full-flow successes ====="
          PROXIES=$(curl -s -m 20 "https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&protocol=http&proxy_format=ipport&format=text&timeout=5000" | tr -d '\r' | grep -E '^[0-9.]+:[0-9]+$' | head -30)
          echo "candidates: $(echo "$PROXIES" | wc -l)"
          OK=0; WINNERS=""
          for P in $PROXIES; do
            [ $OK -ge 2 ] && break
            rm -f /tmp/cj_d
            curl -s -m $T -x "http://$P" -c /tmp/cj_d -o /tmp/d_home.html "$HOME_URL" || { echo "proxy $P: home FAIL"; continue; }
            curl -s -m $T -x "http://$P" -b /tmp/cj_d -o /tmp/d_lista.html "$LISTA_URL" || { echo "proxy $P: lista FAIL"; continue; }
            R=$(rows /tmp/d_lista.html)
            if [ "$R" -gt 0 ] 2>/dev/null; then
              echo "proxy $P: FULL FLOW OK (rows=$R) — testing WebForms postback..."
              python3 -c "
import re, urllib.parse
html = open('/tmp/d_lista.html').read()
def val(n):
    m = re.search(r'name=\"%s\"[^>]*value=\"([^\"]*)\"' % re.escape(n), html)
    return m.group(1) if m else ''
data = {'__VIEWSTATE': val('__VIEWSTATE'), '__VIEWSTATEGENERATOR': val('__VIEWSTATEGENERATOR'), '__EVENTVALIDATION': val('__EVENTVALIDATION'), 'ctl00\$Contenuto\$dgSondaggi_PaginaSuccessiva': ' > '}
open('/tmp/post_data.txt','w').write(urllib.parse.urlencode(data))
m = re.search(r'title=\"(\d{2}/\d{2}/\d{4})\"', html)
open('/tmp/page1_date.txt','w').write(m.group(1) if m else '?')
"
              curl -s -m $T -x "http://$P" -b /tmp/cj_d -X POST --data @/tmp/post_data.txt -o /tmp/d_page2.html "$LISTA_URL"
              P2ROWS=$(rows /tmp/d_page2.html)
              D1=$(cat /tmp/page1_date.txt)
              D2=$(grep -oE 'title="[0-9]{2}/[0-9]{2}/[0-9]{4}"' /tmp/d_page2.html | head -1 | grep -oE '[0-9]{2}/[0-9]{2}/[0-9]{4}')
              echo "postback via $P: page2 rows=$P2ROWS first-date page1=$D1 page2=$D2"
              if [ -n "$D2" ] && [ "$D1" != "$D2" ]; then echo "RESULT postback-via-$P: WORKED"; else echo "RESULT postback-via-$P: FAILED (same page)"; fi
              OK=$((OK+1)); WINNERS="$WINNERS $P"
            else
              echo "proxy $P: lista reached but no rows (blocked?)"
            fi
          done
          echo "RESULT d2-pool: $OK proxies completed full flow:$WINNERS"
          echo "===== DONE ====="
