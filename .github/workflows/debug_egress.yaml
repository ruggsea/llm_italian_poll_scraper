# TEMPORARY DEBUG WORKFLOW — round 3. workflow_dispatch + push to this branch only.
# NEVER merge to main; no schedule. DELETE once egress question is settled.
# Question: is the tarpit per-IP (lottery) or per-client (curl vs Firefox)?
# Method: on ONE runner, try curl, curl with Firefox UA, then real headless Firefox.
name: DEBUG egress probes r3 (manual only)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/gha-hosted-egress

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Direct reachability lottery probe
        run: |
          set +e
          IP=$(curl -s -m 10 https://api.ipify.org)
          CODE=$(curl -s -m 25 -o /tmp/p.html -w "%{http_code}" "https://www.sondaggipoliticoelettorali.it/Home.aspx?st=HOME")
          ROWS_MARKER=$(grep -c "Sondaggi" /tmp/p.html 2>/dev/null)
          echo "RESULT attempt=${{ matrix.attempt }} ip=$IP http=$CODE marker=$ROWS_MARKER"
